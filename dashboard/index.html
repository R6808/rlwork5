<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园生活数据看板</title>

  <link rel="icon" href="data:,">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    #tip {
      padding: 10px;
      margin: 15px 0;
      background: #f2f2f2;
    }

    .buttons {
      margin-bottom: 20px;
    }

    .buttons button {
      margin-right: 8px;
      padding: 8px 15px;
      cursor: pointer;
    }

    .charts {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .chart {
      width: 450px;
      height: 350px;
    }
  </style>
</head>

<body>

  <h1>校园生活数据看板</h1>

  <div id="tip">正在加载数据...</div>

  <div class="buttons">
    <button data-type="全部">全部</button>
    <button data-type="学习">学习</button>
    <button data-type="生活">生活</button>
    <button data-type="运动">运动</button>
  </div>

  <div class="charts">
    <div id="bar-chart" class="chart"></div>
    <div id="pie-chart" class="chart"></div>
  </div>

  <script src="app.js"></script>

</body>
</html>
